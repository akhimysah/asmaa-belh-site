name: Vérification du site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"   # chaque lundi à 7 h (UTC) : liens externes (vidéos Dropbox, Amazon)
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôle des liens, images, ancres et métadonnées
        if: github.event_name != 'schedule'
        run: python3 tools/check.py
      - name: Contrôle complet, liens externes compris
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tools/check.py --externes

  tests:
    name: Tests de bout en bout (Chrome)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Serveur local
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/ >/dev/null && break; sleep 0.5; done
      - name: Menu, formulaires, galerie, présentation, mobile…
        run: node tools/e2e.js
        env:
          BASE: http://localhost:8765

  lighthouse:
    name: Audit Lighthouse
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Serveur local avec compression (comme GitHub Pages)
        run: |
          echo '{ "cleanUrls": false, "trailingSlash": false }' > "$RUNNER_TEMP/serve.json"
          npx --yes serve@14 -l 8765 --no-clipboard --config "$RUNNER_TEMP/serve.json" . >/dev/null 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:8765/index.html >/dev/null && break; sleep 0.5; done
          echo "redirection index.html : $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/index.html)"
          echo "compression style.css : $(curl -s -o /dev/null -D - -H 'Accept-Encoding: gzip' http://localhost:8765/assets/css/style.css | grep -i content-encoding || echo absente)"
      - name: Notes performance, accessibilité, bonnes pratiques, référencement
        run: node tools/lighthouse.js
        env:
          BASE: http://localhost:8765
          CHROME_PATH: /usr/bin/google-chrome
